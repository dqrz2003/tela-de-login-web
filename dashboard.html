<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Boas-vindas ao painel seguro do usuário">
  <title>Boas-vindas | SecureAuth Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard-body">

  <!-- Ambient Motion Design: Orbes de Luz e Brilho Laranja Vivo -->
  <div class="ambient-glow glow-orange-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-orange-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-orange-3" aria-hidden="true"></div>

  <!-- Tela de Carregamento & Verificação Inicial -->
  <div id="auth-loading" class="auth-loading">
    <div class="spinner-ring" aria-hidden="true">
      <div class="spinner-core"></div>
    </div>
    <p class="loading-text">Validando sua sessão segura...</p>
  </div>

  <!-- Conteúdo Principal de Boas-Vindas -->
  <div id="dashboard-content" class="dashboard-content" hidden>
    
    <!-- Barra Superior Minimalista -->
    <header class="top-nav">
      <div class="nav-container">
        <div class="nav-brand">
          <div class="brand-mini-badge" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <span class="nav-title">SecureAuth</span>
        </div>

        <div class="nav-user">
          <span class="nav-user-email" id="header-user-email">...</span>
          <button type="button" id="btn-logout" class="btn-logout-nav" aria-label="Sair da conta">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Área Central de Apresentação -->
    <main class="welcome-section">
      <div class="welcome-card">
        
        <!-- Efeito de Brilho Dinâmico de Fundo no Card -->
        <div class="card-glow-reflection" aria-hidden="true"></div>

        <!-- Avatar com Anel Pulsante e Badge de Verificação -->
        <div class="avatar-wrapper">
          <div class="avatar-pulse-ring" aria-hidden="true"></div>
          <div class="user-avatar-hero" id="user-avatar" aria-hidden="true">U</div>
          <div class="verified-badge" title="Login Seguro Verificado" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
        </div>

        <!-- Chip de Status Ativo -->
        <div class="status-chip">
          <span class="status-live-dot" aria-hidden="true"></span>
          <span>Login Realizado com Sucesso</span>
        </div>

        <!-- Títulos de Boas-Vindas -->
        <h1 class="hero-title">
          Bem-vindo(a), <span class="highlight-name" id="welcome-user-name">Usuário</span>!
        </h1>
        <p class="hero-subtitle">
          Sua identidade foi autenticada e protegida com criptografia ponta a ponta.
        </p>

        <!-- Três Cards de Destaque com Efeito Glassmorphism & Sombra Laranja -->
        <div class="info-pills-grid">
          
          <div class="info-pill-item">
            <div class="pill-icon icon-mail" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
            <div class="pill-content">
              <span class="pill-label">Conta Conectada</span>
              <strong class="pill-value" id="detail-email">carregando...</strong>
            </div>
          </div>

          <div class="info-pill-item">
            <div class="pill-icon icon-shield" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="pill-content">
              <span class="pill-label">Sessão Criptografada</span>
              <strong class="pill-value text-accent">scrypt 512b Ativo</strong>
            </div>
          </div>

          <div class="info-pill-item">
            <div class="pill-icon icon-time" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
            <div class="pill-content">
              <span class="pill-label">Horário de Entrada</span>
              <strong class="pill-value" id="log-login-time">Agora</strong>
            </div>
          </div>

        </div>

        <!-- Metadados Ocultos/Auxiliares para scripts existentes -->
        <span id="detail-id" hidden></span>
        <span id="detail-created" hidden></span>
        <span id="account-created-at" hidden></span>

        <!-- Ações do Usuário -->
        <div class="welcome-actions">
          <button type="button" id="btn-refresh-session" class="btn-hero-action">
            <svg class="action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 2v6h-6"/>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
              <path d="M3 22v-6h6"/>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            </svg>
            <span>Verificar Conexão</span>
          </button>
          
          <a href="index.html" class="btn-hero-secondary">
            <span>Trocar de Conta</span>
          </a>
        </div>

      </div>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
