<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Tela de login moderna com campos flutuantes, motion design e paleta laranja e branco">
  <title>Acesso à Conta | SecureAuth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Elementos de Ambient Motion Design (Orbes de Luz Flutuantes) -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <!-- Container Principal sem quadros ou caixas delimitadoras -->
  <main class="login-wrapper">
    <div class="login-frameless">
      
      <!-- Cabeçalho com Ícone e Títulos -->
      <header class="login-header">
        <div class="brand-badge" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </div>
        <h1 class="login-title" id="form-title">Bem-vindo(a)</h1>
        <p class="login-subtitle" id="form-subtitle">Digite suas credenciais para continuar.</p>
      </header>

      <!-- Mensagens de Alerta (Sucesso / Erro do Servidor) -->
      <div class="form-alert" id="form-alert" role="alert" hidden></div>

      <!-- Formulário com Campos Flutuantes -->
      <form class="login-form" action="/api/login" method="POST" novalidate>
        
        <!-- Campo Flutuante: E-mail -->
        <div class="floating-group">
          <div class="floating-field">
            <span class="field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="floating-input" 
              placeholder=" " 
              autocomplete="username" 
              spellcheck="false" 
              autocapitalize="none" 
              enterkeyhint="next" 
              required
            >
            <label for="email" class="floating-label">Seu e-mail</label>
            <span class="field-indicator" aria-hidden="true"></span>
          </div>
          <span class="error-message" id="email-error" aria-live="polite"></span>
        </div>

        <!-- Campo Flutuante: Senha -->
        <div class="floating-group">
          <div class="floating-field">
            <span class="field-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="floating-input" 
              placeholder=" " 
              autocomplete="current-password" 
              enterkeyhint="done" 
              required 
              minlength="6"
            >
            <label for="password" class="floating-label">Sua senha</label>
            <button 
              type="button" 
              id="toggle-password" 
              class="password-toggle-btn" 
              aria-label="Mostrar senha" 
              aria-pressed="false"
            >
              <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" x2="22" y1="2" y2="22"/>
              </svg>
            </button>
            <span class="field-indicator" aria-hidden="true"></span>
          </div>
          <span class="error-message" id="password-error" aria-live="polite"></span>
        </div>

        <!-- Opções Extras (Lembrar-me & Esqueci a senha) -->
        <div class="form-options">
          <label class="checkbox-container" for="remember">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkbox-label">Lembrar de mim</span>
          </label>
          <a href="#recuperar-senha" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <!-- Botão de Ação com Efeito Motion Glow -->
        <button type="submit" class="btn-primary" id="btn-submit">
          <span id="btn-submit-text">Entrar</span>
          <svg class="btn-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <!-- Divisor Social Minimalista -->
        <div class="divider" role="separator" id="social-divider">
          <span>ou continue com</span>
        </div>

        <!-- Opções Sociais Flutuantes -->
        <div class="social-login-group" id="social-group">
          <button type="button" class="btn-social" aria-label="Entrar com Google">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Google</span>
          </button>
          <button type="button" class="btn-social" aria-label="Entrar com GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            <span>GitHub</span>
          </button>
        </div>
      </form>

      <!-- Rodapé de Alternância -->
      <footer class="login-footer">
        <p class="signup-prompt">
          <span id="toggle-prompt-text">Não tem uma conta?</span>
          <button type="button" id="toggle-mode-btn" class="toggle-mode-btn">Cadastre-se</button>
        </p>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
